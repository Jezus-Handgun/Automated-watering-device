version: "3.9"

services:
  watering:
    build: .
    ports:
      - "5000:5000"
      - "8080:8080"
    volumes:
      - ./backend/instance:/data
    environment:
      API_BASE: http://localhost:5000
      DATABASE_PATH: /data/watering.db
      PUMP_PIN: "17"
      VALVE_PIN: "27"
      MOISTURE_CHANNELS: "0,1,2"
      APP_DEBUG: "0"
